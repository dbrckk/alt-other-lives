name: Tagged Android Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ALT_ANDROID_KEYSTORE_BASE64: ${{ secrets.ALT_ANDROID_KEYSTORE_BASE64 }}
      ALT_KEYSTORE_PASSWORD: ${{ secrets.ALT_KEYSTORE_PASSWORD }}
      ALT_KEY_ALIAS: ${{ secrets.ALT_KEY_ALIAS }}
      ALT_KEY_PASSWORD: ${{ secrets.ALT_KEY_PASSWORD }}
      ALT_VERSION_CODE: ${{ vars.ALT_VERSION_CODE }}
      ALT_VERSION_NAME: ${{ vars.ALT_VERSION_NAME }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Validate release metadata
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Release tag must use vMAJOR.MINOR.PATCH."
            exit 1
          fi
          expected_version_name="${tag#v}"
          if [[ -z "$ALT_VERSION_NAME" || "$ALT_VERSION_NAME" != "$expected_version_name" ]]; then
            echo "::error::ALT_VERSION_NAME must exactly match the release tag without the v prefix."
            exit 1
          fi
          if [[ -z "$ALT_VERSION_CODE" || ! "$ALT_VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::ALT_VERSION_CODE must be an explicit positive integer for a tagged release."
            exit 1
          fi

      - name: Validate signing secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in             ALT_ANDROID_KEYSTORE_BASE64             ALT_KEYSTORE_PASSWORD             ALT_KEY_ALIAS             ALT_KEY_PASSWORD
          do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is required for a tagged release."
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Generate baseline profile
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: gradle :app:generateBaselineProfile -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=BaselineProfile --stacktrace --info

      - name: Prepare release keystore
        shell: bash
        run: |
          set -euo pipefail
          keystore_path="$RUNNER_TEMP/alt-release.jks"
          printf '%s' "$ALT_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          echo "ALT_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Build signed release AAB
        run: gradle :app:bundleRelease --stacktrace

      - name: Verify signed release AAB
        shell: bash
        run: |
          set -euo pipefail
          aab="$(find app/build/outputs/bundle/release -maxdepth 1 -name '*.aab' -print -quit)"
          if [[ -z "$aab" ]]; then
            echo "::error::Release AAB was not produced."
            exit 1
          fi
          jarsigner -verify -strict "$aab"

      - name: Upload signed release AAB
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alt-${{ env.ALT_VERSION_NAME }}-signed-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
