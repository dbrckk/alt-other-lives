name: Android CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ALT_ANDROID_KEYSTORE_BASE64: ${{ secrets.ALT_ANDROID_KEYSTORE_BASE64 }}
      ALT_KEYSTORE_PASSWORD: ${{ secrets.ALT_KEYSTORE_PASSWORD }}
      ALT_KEY_ALIAS: ${{ secrets.ALT_KEY_ALIAS }}
      ALT_KEY_PASSWORD: ${{ secrets.ALT_KEY_PASSWORD }}
      ALT_VERSION_CODE: ${{ vars.ALT_VERSION_CODE }}
      ALT_VERSION_NAME: ${{ vars.ALT_VERSION_NAME }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: "8.11.1"
      - name: Resolve build version metadata
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$ALT_VERSION_CODE" ]]; then
            commit_count="$(git rev-list --count HEAD)"
            if [[ -z "$commit_count" || ! "$commit_count" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Unable to derive a positive versionCode from Git history."
              exit 1
            fi
            echo "ALT_VERSION_CODE=$commit_count" >> "$GITHUB_ENV"
          fi
          if [[ -z "$ALT_VERSION_NAME" ]]; then
            short_sha="$(git rev-parse --short=8 HEAD)"
            echo "ALT_VERSION_NAME=0.1.0-ci.$short_sha" >> "$GITHUB_ENV"
          fi
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Android lint
        run: gradle :app:lintDebug --stacktrace
      - name: Release lint
        run: gradle :app:lintRelease --stacktrace
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Compile instrumentation tests
        run: gradle :app:assembleDebugAndroidTest --stacktrace
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/run-instrumentation-tests.sh
      - name: Upload instrumentation diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alt-instrumentation-diagnostics
          if-no-files-found: warn
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            app/build/instrumentation-logcat.txt
      - name: Upload generated baseline profile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alt-baseline-profile
          if-no-files-found: error
          path: app/src/main/generated/baselineProfiles/
      - name: Validate release signing configuration
        shell: bash
        run: |
          set -euo pipefail
          configured=0
          for value in             "$ALT_ANDROID_KEYSTORE_BASE64"             "$ALT_KEYSTORE_PASSWORD"             "$ALT_KEY_ALIAS"             "$ALT_KEY_PASSWORD"; do
            if [[ -n "$value" ]]; then
              configured=$((configured + 1))
            fi
          done
          if [[ "$configured" -ne 0 && "$configured" -ne 4 ]]; then
            echo "::error::Release signing secrets are only partially configured."
            exit 1
          fi
          if [[ "$configured" -eq 4 ]]; then
            if [[ -z "$ALT_VERSION_CODE" || ! "$ALT_VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Signed releases require ALT_VERSION_CODE to be a positive integer repository variable."
              exit 1
            fi
            if [[ -z "${ALT_VERSION_NAME//[[:space:]]/}" ]]; then
              echo "::error::Signed releases require a non-empty ALT_VERSION_NAME repository variable."
              exit 1
            fi
            echo "ALT_RELEASE_SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "ALT_RELEASE_SIGNED=false" >> "$GITHUB_ENV"
            echo "::warning::Release AAB will be unsigned because release signing secrets are not configured."
          fi
      - name: Prepare release keystore
        if: env.ALT_RELEASE_SIGNED == 'true'
        run: |
          echo "$ALT_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/alt-release.jks"
          echo "ALT_KEYSTORE_PATH=$RUNNER_TEMP/alt-release.jks" >> "$GITHUB_ENV"
      - name: Build release AAB
        run: gradle :app:bundleRelease --stacktrace
      - name: Verify signed release AAB
        if: env.ALT_RELEASE_SIGNED == 'true'
        run: jarsigner -verify -strict app/build/outputs/bundle/release/app-release.aab
      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alt-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload signed release AAB
        if: env.ALT_RELEASE_SIGNED == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alt-release-aab-signed
          path: app/build/outputs/bundle/release/app-release.aab
      - name: Upload unsigned release AAB
        if: env.ALT_RELEASE_SIGNED != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alt-release-aab-unsigned
          path: app/build/outputs/bundle/release/app-release.aab
